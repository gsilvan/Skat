[project]
name = "skat"
version = "0.2.0"
description = "Official digital Skat engine with MCTS and transformer policies"
authors = [
  { name = "Silvan Gümüsdere", email = "silvan@trollbox.org"},
]
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = ["numpy>=2.2.0", "tqdm>=4.67.1"]

[project.optional-dependencies]
ai = ["torch>=2.5.1"]
sgf = ["pysgf>=0.9.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "platform_system != 'Darwin'"},
]
